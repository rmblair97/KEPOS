name: Reformat explanations

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to do"
        type: choice
        options: [preview, apply, restore]
        default: preview
      preview_run_id:
        description: "apply only - Run ID of the approved preview run"
        required: false
      backup_run_id:
        description: "restore only - Run ID of the run whose backup to restore"
        required: false
      also_title:
        description: "preview only - optional exact title for the third card"
        required: false

jobs:
  reformat:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up a clean folder with just the one dependency
        run: |
          mkdir run
          cp reformat-explanations.mjs run/
          cd run
          npm init -y
          npm install @supabase/supabase-js@2

      - name: Fetch the approved preview (apply only)
        if: inputs.mode == 'apply'
        uses: actions/download-artifact@v4
        with:
          name: reformat-preview
          path: run
          run-id: ${{ inputs.preview_run_id }}
          github-token: ${{ github.token }}

      - name: Fetch the backup (restore only)
        if: inputs.mode == 'restore'
        uses: actions/download-artifact@v4
        with:
          name: explanation-backup
          path: run
          run-id: ${{ inputs.backup_run_id }}
          github-token: ${{ github.token }}

      - name: Run
        working-directory: run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODE: ${{ inputs.mode }}
          ALSO_TITLE: ${{ inputs.also_title }}
        run: |
          if [ "$MODE" = "restore" ]; then
            node reformat-explanations.mjs restore "$(ls explanation-backup-*.json | head -1)"
          elif [ "$MODE" = "preview" ] && [ -n "$ALSO_TITLE" ]; then
            node reformat-explanations.mjs preview --also "$ALSO_TITLE"
          else
            node reformat-explanations.mjs "$MODE"
          fi

      - name: Keep the preview file
        if: always() && inputs.mode == 'preview'
        uses: actions/upload-artifact@v4
        with:
          name: reformat-preview
          path: run/reformat-preview.json
          if-no-files-found: ignore

      - name: Keep the backup
        if: always() && inputs.mode != 'restore'
        uses: actions/upload-artifact@v4
        with:
          name: explanation-backup
          path: run/explanation-backup-*.json
          if-no-files-found: ignore
